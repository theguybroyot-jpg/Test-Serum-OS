<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library</title>
<link href="assets/remixicon/remixicon.css" rel="stylesheet">
<link href="core/skeleton.css?v=1" rel="stylesheet">
<style>
:root {
    --surface: rgba(255, 255, 255, 0.04);
    --surface-2: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #ededf0;
    --text-dim: rgba(237, 237, 240, 0.62);
    --text-faint: rgba(237, 237, 240, 0.36);
    --accent: #ff8453;
    --accent-soft: rgba(255, 132, 83, 0.18);
    --good: #1ed76e;
    --good-soft: rgba(30, 215, 110, 0.18);
    --motion: cubic-bezier(0.22, 1, 0.36, 1);
    --row-h: 220px;
}
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(10,10,12,0.5) 0%, rgba(10,10,12,0.3) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }

.shell {
    height: 100%; overflow-y: auto; overflow-x: hidden;
    padding: 32px 0 80px;
    scroll-behavior: smooth;
}
.shell::-webkit-scrollbar { width: 8px; }
.shell::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }
.shell::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

.padded { padding: 0 36px; }

/* page hero */
header.hero {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; margin-bottom: 4px;
}
header.hero h1 {
    font-size: 38px; font-weight: 800; letter-spacing: -0.035em;
    margin: 0; line-height: 1;
}
.subhead {
    color: var(--text-faint); font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-top: 6px; margin-bottom: 24px;
    font-weight: 600;
}
.searchwrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 14px;
    width: 280px;
    transition: border-color 150ms, width 220ms var(--motion);
}
.searchwrap:focus-within { border-color: var(--border-strong); width: 360px; }
.searchwrap i { color: var(--text-faint); font-size: 16px; }
.searchwrap input { flex: 1; min-width: 0; font-size: 13px; }

/* tabs */
.tabs {
    display: flex; gap: 2px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
}
.tab {
    padding: 10px 18px; font-size: 14px; font-weight: 500;
    color: var(--text-dim); position: relative;
    transition: color 150ms;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); }
.tab.active::after {
    content: ''; position: absolute; left: 18px; right: 18px; bottom: -1px; height: 2px;
    background: var(--accent); border-radius: 2px;
}
.tab .badge {
    display: inline-block; margin-left: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
    font-size: 11px; color: var(--text-dim); font-weight: 500;
}

/* category chips */
.chips { display: flex; gap: 4px; margin-bottom: 26px; flex-wrap: wrap; }
.chip {
    padding: 7px 14px; border-radius: 8px;
    background: transparent; border: 1px solid transparent;
    color: var(--text-dim); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 150ms;
    text-transform: capitalize;
}
.chip:hover { background: var(--surface); color: var(--text); }
.chip.active { background: var(--accent-soft); color: var(--accent); }

/* sections */
.section { margin-bottom: 38px; }
.section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
}
.section-title {
    font-size: 20px; font-weight: 700; letter-spacing: -0.015em;
    margin: 0;
}
.section-meta { color: var(--text-faint); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

/* hero carousel — single big card, auto-rotating */
.carousel {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    aspect-ratio: 21/8;
    background: #0a0a0c;
    border: 1px solid var(--border);
}
.carousel .slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 700ms ease;
    cursor: pointer;
}
.carousel .slide.active { opacity: 1; z-index: 1; }
.carousel .slide .thumb {
    position: absolute; inset: 0;
    background-position: center; background-size: cover;
    transform: scale(1.04);
    transition: transform 8s ease-out;
}
.carousel .slide.active .thumb { transform: scale(1); }
.carousel .slide .veil {
    position: absolute; inset: 0;
    background:
        linear-gradient(95deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 80%),
        linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.55) 100%);
}
.carousel .slide .body {
    position: absolute; left: 38px; bottom: 36px; right: 38px;
    z-index: 2;
}
.carousel .slide .cat {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
    margin-bottom: 10px;
}
.carousel .slide .name {
    font-size: 36px; font-weight: 800; letter-spacing: -0.03em;
    line-height: 1; margin-bottom: 16px;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.65);
}
.carousel .slide .actions {
    display: flex; gap: 10px;
}
.carousel .dots {
    position: absolute; bottom: 16px; right: 24px; z-index: 3;
    display: flex; gap: 6px;
}
.carousel .dot {
    width: 22px; height: 3px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.25);
    transition: background 200ms;
    cursor: pointer;
}
.carousel .dot.active { background: rgba(255, 255, 255, 0.85); }

/* primary action button (used in hero + library) */
.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    transition: transform 140ms, filter 140ms;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--accent); color: #1a0a04; box-shadow: 0 8px 18px rgba(255, 132, 83, 0.32); }
.btn.success { background: var(--good); color: #042713; box-shadow: 0 8px 18px rgba(30, 215, 110, 0.32); }
.btn.ghost { background: rgba(255, 255, 255, 0.08); color: white; backdrop-filter: blur(12px); }

/* marquee rows — auto-scroll, pause on hover */
.row-mask {
    position: relative;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
    padding: 6px 0;
}
.marquee {
    display: flex; gap: 12px;
    width: max-content;
    animation: marquee var(--dur, 90s) linear infinite;
}
.row-mask:hover .marquee { animation-play-state: paused; }
@keyframes marquee {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* card */
.card {
    flex: 0 0 168px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 200ms var(--motion);
    position: relative;
    background: #0a0a0c;
    border: 1px solid var(--border);
}
.card:hover {
    transform: translateY(-5px) scale(1.02);
    border-color: rgba(255, 132, 83, 0.4);
    z-index: 2;
}
.card .thumb {
    width: 100%;
    aspect-ratio: 1;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    position: relative;
}
.card .thumb::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,0.92) 100%);
    opacity: 0; transition: opacity 200ms;
}
.card:hover .thumb::after { opacity: 1; }

/* status pill — bottom-left only */
.card .pill, .lib-card .pill {
    position: absolute;
    left: 8px; bottom: 8px;
    top: auto; right: auto;
    z-index: 3;
    padding: 4px 9px 4px 8px;
    border-radius: 999px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: transform 140ms;
    display: inline-flex; align-items: center; gap: 4px;
    line-height: 1; white-space: nowrap;
    border: 0;
}
.card .pill:hover, .lib-card .pill:hover { transform: scale(1.06); }
.pill.get  { background: rgba(255, 132, 83, 0.95); color: #1a0a04; }
.pill.play { background: rgba(30, 215, 110, 0.95); color: #042713; }
.pill i { font-size: 11px; }

/* card name reveal on hover */
.card-meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 12px 10px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.92));
    opacity: 0; transform: translateY(4px);
    transition: opacity 200ms, transform 200ms;
    pointer-events: none;
    z-index: 2;
}
.card:hover .card-meta { opacity: 1; transform: translateY(0); }
.card-meta .name {
    font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-meta .cat {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
}

/* generated thumb */
.gen-thumb {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; letter-spacing: -0.04em;
    color: rgba(255, 255, 255, 0.92);
}

/* grid + library cards */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
}

.loader, .empty { text-align: center; padding: 80px 20px; color: var(--text-faint); font-size: 13px; }
.empty i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.45; }

/* game info modal */
.modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
}
.modal[hidden] { display: none; }
.modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(10px);
    cursor: pointer;
}
.modal-card {
    position: relative; z-index: 1;
    width: min(700px, 100%); max-height: calc(100vh - 48px);
    border-radius: 18px; overflow: hidden;
    background: linear-gradient(180deg, #15151c, #0e0e14);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.7);
    animation: modalIn 240ms var(--motion);
    display: flex; flex-direction: column;
}
@keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-art {
    aspect-ratio: 21/8;
    background-position: center; background-size: cover;
    position: relative;
    flex: 0 0 auto;
}
.modal-art::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, #15151c 100%);
}
.modal-close {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    color: rgba(255, 255, 255, 0.85);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 150ms;
}
.modal-close:hover { background: rgba(0, 0, 0, 0.75); }
.modal-close i { font-size: 18px; }
.modal-body {
    padding: 22px 28px 28px;
    overflow-y: auto;
}
.modal-cat {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
}
.modal-name {
    font-size: 30px; font-weight: 800; letter-spacing: -0.025em;
    margin: 6px 0 14px; line-height: 1.05;
}
.modal-stats {
    display: flex; gap: 22px; flex-wrap: wrap;
    color: var(--text-faint); font-size: 12px;
    margin-bottom: 16px;
}
.modal-stats .stat { display: inline-flex; align-items: center; gap: 6px; }
.modal-stats .stat i { font-size: 14px; opacity: 0.8; }
.modal-stats .stat strong { color: var(--text-dim); font-weight: 600; }
.modal-desc {
    color: var(--text-dim); font-size: 14px; line-height: 1.6;
    margin: 0 0 24px;
}
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { padding: 12px 24px; font-size: 14px; }
.modal-actions .btn.uninstall {
    background: transparent; color: var(--text-faint);
    border: 1px solid var(--border);
}
.modal-actions .btn.uninstall:hover { color: var(--text); border-color: var(--border-strong); }
/* favorite heart on cards */
.card { position: relative; }
.fav-btn { position: absolute; top: 8px; right: 8px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; opacity: 0; transform: scale(0.9); transition: opacity 140ms, transform 140ms, background 140ms, color 140ms; backdrop-filter: blur(6px); }
.card:hover .fav-btn { opacity: 1; transform: scale(1); }
.fav-btn:hover { background: rgba(0,0,0,0.75); }
.fav-btn.on { opacity: 1; transform: scale(1); color: #ff5a7a; }
.chips .chip i { font-size: 13px; margin-right: 4px; vertical-align: -1px; }
.chip.fav-chip.active, .chip.fav-chip:hover { color: #ff5a7a; }
