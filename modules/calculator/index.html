<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<style>
:root {
    --text:        #f3f3f5;
    --text-dim:    rgba(243, 243, 245, 0.62);
    --line:        rgba(255, 255, 255, 0.06);
    --num:         rgba(255, 255, 255, 0.05);
    --num-h:       rgba(255, 255, 255, 0.09);
    --aux:         rgba(255, 255, 255, 0.10);
    --aux-h:       rgba(255, 255, 255, 0.16);
    --accent:      #ff8453;
    --accent-h:    #ffa078;
    --motion:      cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    /* transparent — SerumOS window's frosted glass shows through */
    background: transparent;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.app {
    display: flex; flex-direction: column;
    height: 100vh;
    padding: 14px;
    gap: 10px;
}

.display {
    flex: 0 0 auto;
    border-radius: 10px;
    padding: 18px 20px 16px;
    text-align: right;
    overflow: hidden;
    min-height: 100px;
    display: flex; flex-direction: column; justify-content: flex-end;
    border-bottom: 1px solid var(--line);
}
.display .expr {
    font-size: 13px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-height: 18px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl;
}
.display .result {
    font-size: 38px; font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl;
}

.grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    min-height: 0;
}

.btn {
    border-radius: 10px;
    background: var(--num);
    border: 1px solid var(--line);
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
    transition: background 100ms, transform 80ms ease, border-color 120ms;
    display: flex; align-items: center; justify-content: center;
}
.btn:hover { background: var(--num-h); border-color: rgba(255, 255, 255, 0.1); }
.btn:active { transform: scale(0.97); }
.btn.aux { background: var(--aux); font-size: 16px; color: var(--text-dim); }
.btn.aux:hover { background: var(--aux-h); color: var(--text); }
.btn.op {
    background: rgba(255, 132, 83, 0.15);
    color: var(--accent);
    border-color: rgba(255, 132, 83, 0.25);
    font-size: 22px; font-weight: 600;
}
.btn.op:hover { background: rgba(255, 132, 83, 0.25); }
.btn.op.active {
    background: var(--accent);
    color: #1a0a04;
    border-color: var(--accent);
}
.btn.eq {
    background: var(--accent);
    color: #1a0a04;
    border-color: var(--accent);
    font-weight: 700;
}
.btn.eq:hover { background: var(--accent-h); border-color: var(--accent-h); }
.btn.zero { grid-column: span 2; justify-content: flex-start; padding-left: 22px; }
</style>
</head>
<body>
<div class="app">
    <div class="display">
        <div class="expr"   id="expr"></div>
        <div class="result" id="result">0</div>
    </div>
    <div class="grid">
        <button class="btn aux" data-act="clear">AC</button>
        <button class="btn aux" data-act="negate">±</button>
        <button class="btn aux" data-act="percent">%</button>
        <button class="btn op"  data-op="/">÷</button>

        <button class="btn" data-num="7">7</button>
        <button class="btn" data-num="8">8</button>
        <button class="btn" data-num="9">9</button>
        <button class="btn op" data-op="*">×</button>

        <button class="btn" data-num="4">4</button>
        <button class="btn" data-num="5">5</button>
        <button class="btn" data-num="6">6</button>
        <button class="btn op" data-op="-">−</button>

        <button class="btn" data-num="1">1</button>
        <button class="btn" data-num="2">2</button>
        <button class="btn" data-num="3">3</button>
        <button class="btn op" data-op="+">+</button>

        <button class="btn zero" data-num="0">0</button>
        <button class="btn" data-act="dot">.</button>
        <button class="btn eq" data-act="equals">=</button>
    </div>
