<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <title>
      SerumOS
    </title>
    <link href="/assets/remixicon/remixicon.css" rel="stylesheet" />
    <script src="core/config.js">
    </script>
    <script src="core/fs.js">
    </script>
    <script src="auth-vendor/supabase.js">
    </script>
    <script src="core/auth.js">
    </script>
    <script src="core/serum-sync.js?v=4">
    </script>
    <script src="core/ads.js">
    </script>
    <script src="core/visualizer.js">
    </script>
    <script src="core/analytics.js">
    </script>
    <style>
      :root {
    --bg: #0a0a0c;
    --surface: rgba(20, 20, 24, 0.72);
    --surface-2: rgba(28, 28, 34, 0.88);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #ededf0;
    --text-dim: rgba(237, 237, 240, 0.55);
    --text-faint: rgba(237, 237, 240, 0.32);
    --accent: #ff8453;
    --accent-rgb: 255, 132, 83;
    --accent-soft: rgba(255, 132, 83, 0.18);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
    --radius: 14px;
    --titlebar: 38px;
    --dock-h: 76px;
    --taskbar-h: 48px;
    --motion: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, &#39;SF Pro Display&#39;, &#39;Inter&#39;, system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; background: none; border: 0; outline: 0; }

/* ===== background engine ===== */
#bg {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden;
    background: #000 url(&#39;assets/wallpaper.gif&#39;) center/cover no-repeat;
}
#bg.mode-image { background: #000 center/cover no-repeat; }
#bg.mode-video { background: #000; }
#bg-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
}
#bg.mode-video #bg-video { display: block; }

/* particle layer — kept for future &#34;abstract&#34; theme presets, hidden by default */
#petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; display: none; }
body.show-petals #petals { display: block; }

/* keep UI layers above bg */
#desktop, #dock, #topbar, #spotlight, .window {
    position: fixed;
}
#desktop { inset: 0; z-index: 2; }
/* audio spectrum visualizer — bottom-centre, behind the icons, above the taskbar.
   SerumViz (core/visualizer.js) mounts on this canvas and the music module feeds
   it FFT bands over postMessage while a track plays. */
#signal {
    position: fixed;
    left: 50%;
    bottom: calc(var(--taskbar-h) + 10px);
    transform: translateX(-50%);
    width: min(720px, 52vw);
    height: 148px;
    z-index: 1;
    pointer-events: none;
}

/* desktop icons — apps + installed games, draggable */
.dicon {
    position: absolute; z-index: 3;
    width: 76px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    transition: transform 160ms var(--motion);
}
.dicon:hover { transform: translateY(-2px); }
.dicon:hover .image::after { opacity: 1; }
.dicon.dragging { transition: none !important; opacity: 0.92; z-index: 4; cursor: grabbing; }
/* windows-style square around whole tile */
.dicon.selected::before {
    content: &#39;&#39;;
    position: absolute;
    inset: -5px -2px -3px -2px;
    background: rgba(255, 132, 83, 0.14);
    border: 1px solid rgba(255, 132, 83, 0.55);
    border-radius: 10px;
    z-index: -1;
    pointer-events: none;
}
.dicon.selected .image {
    box-shadow:
        0 0 0 2px rgba(255, 132, 83, 0.9),
        0 8px 24px rgba(0, 0, 0, 0.45);
}
.dicon.selected .label {
    color: #fff;
}

/* drag-select marquee */
#desk-marquee {
    position: fixed;
    pointer-events: none;
    border: 1px solid rgba(255, 132, 83, 0.85);
    background: rgba(255, 132, 83, 0.12);
    border-radius: 2px;
    z-index: 3;
    display: none;
}
#desk-marquee.active { display: block; }

/* right-click menu (windows style) */
.ctx-menu {
    position: fixed; z-index: 9000; min-width: 220px; padding: 6px;
    background: rgba(43, 43, 51, 0.92); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(30px) saturate(150%);
    font-family: &#39;Segoe UI Variable Text&#39;, &#39;Segoe UI&#39;, system-ui, sans-serif;
    display: none; animation: ctxIn 120ms var(--motion);
}
.ctx-menu.show { display: block; }
@keyframes ctxIn { from { opacity: 0; transform: scale(0.97) translateY(-4px); } to { opacity: 1; transform: none; } }
.ctx-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border-radius: 5px; font-size: 13px; color: #fff; cursor: default; white-space: nowrap;
    transition: background 90ms;
}
.ctx-item i { font-size: 16px; width: 18px; text-align: center; color: rgba(255,255,255,0.8); }
.ctx-item:hover { background: rgba(255,255,255,0.1); }
.ctx-item.danger:hover { background: rgba(255,80,80,0.16); color: #ff8a8a; }
.ctx-item.danger:hover i { color: #ff8a8a; }
.ctx-item .ctx-acc { margin-left: auto; font-size: 11px; color: var(--text-faint); }
.ctx-sep { height: 1px; margin: 5px 8px; background: rgba(255,255,255,0.1); }
/* inline rename */
.dicon .label input {
    width: 100%; text-align: center; font: inherit; color: #fff;
    background: rgba(0,0,0,0.5); border: 1px solid var(--accent); border-radius: 4px;
    padding: 1px 3px; outline: none;
}
.dicon .image {
    --accent-rgb: 255, 132, 83;
    width: 60px; height: 60px;
    border-radius: 17px;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(120% 70% at 30% 0%, rgba(255, 255, 255, 0.10) 0%, transparent 55%),
        linear-gradient(155deg, rgba(36, 36, 44, 0.92) 0%, rgba(14, 14, 18, 0.96) 100%);
    border: 0.5px solid rgba(255, 255, 255, 0.10);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        0 14px 28px rgba(0, 0, 0, 0.5),
        0 3px 8px rgba(0, 0, 0, 0.32);
    display: flex; align-items: center; justify-content: center;
    background-size: cover; background-position: center;
    pointer-events: none;
}
/* subtle accent ambient glow per app — not full color block, just a corner tint */
.dicon .image::before {
    content: &#39;&#39;;
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(80% 60% at 80% 10%, rgba(var(--accent-rgb), 0.32) 0%, transparent 55%);
    mix-blend-mode: screen;
}
/* hover ring */
.dicon .image::after {
    content: &#39;&#39;;
    position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.55);
    opacity: 0;
    transition: opacity 160ms;
}
.dicon.app-games   .image { --accent-rgb: 255, 132, 83; }
.dicon.app-music   .image { --accent-rgb: 30, 215, 110; }
.dicon.app-movies  .image { --accent-rgb: 90, 140, 255; }
.dicon.app-browser .image { --accent-rgb: 199, 90, 255; }
.dicon.app-notepad .image { --accent-rgb: 240, 200, 90; }
.dicon.app-calc    .image { --accent-rgb: 255, 110, 180; }
.dicon.app-settings .image { --accent-rgb: 200, 200, 220; }

.dicon .image i {
    font-size: 26px;
    color: rgba(255, 255, 255, 0.96);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));
    z-index: 1;
    position: relative;
}

/* user-supplied icon swap (drop files into src/assets/icons/&lt;appId&gt;.svg)
   when an img loads ok we add .has-img to its parent and let the artwork
   bleed edge-to-edge over the icon container — fallback SVGs keep the
   dark glass frame because they&#39;re designed for it. */
.app-img {
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1; position: relative;
    pointer-events: none;
}
.app-fallback {
    width: 100%; height: 100%;
    align-items: center; justify-content: center;
    z-index: 1; position: relative;
}
/* settings + mirrors icons tint to the user&#39;s accent — their &lt;img&gt; is swapped for
   a mask element filled with var(--accent) so it tracks whatever accent is chosen */
.acc-icon {
    -webkit-mask: var(--mi) center / contain no-repeat;
    mask: var(--mi) center / contain no-repeat;
    background: var(--accent);
}
/* icons with their own art float on the wallpaper — no dark tile */
.dicon .image.has-img,
.dock-app.has-img {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
}
.dicon .image.has-img::before { display: none; }
.dicon .image.has-img::after { display: none; }
.dock-app.has-img i { display: none; }
/* no tile = no rounded clip, so full-bleed art isn&#39;t cut at the corners */
.dicon .image.has-img { border-radius: 0; overflow: visible; }
.dicon .image.has-img .app-img { object-fit: contain; }
/* files + code art fills its viewbox edge-to-edge — shrink to match the logos */
.dicon.app-files .image.has-img .app-img,
.dicon.app-code .image.has-img .app-img { transform: scale(0.74); }
/* browser logo sits small in its viewbox — bump it up to match */
.dicon.app-browser .image.has-img .app-img { transform: scale(1.18); }
.dicon.has-thumb .image { background-color: #0a0a0c; }
.dicon.has-thumb .image::before { display: none; }
.dicon.has-thumb .image i { display: none; }
.dicon .label {
    font-size: 11px; font-weight: 500;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.5);
    max-width: 76px;
    text-align: center;
    line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
    #bg, #bg::before, .petal { animation: none !important; }
}

/* ===== watermark — subtle brand baked into the bg layer ===== */
#watermark {
    position: fixed;
    right: 50px; top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: 100% 50%;
    font-size: 38px; font-weight: 800;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.22);
    text-shadow:
        0 0 1px rgba(255, 255, 255, 0.12),
        0 2px 24px rgba(0, 0, 0, 0.5);
    pointer-events: none; user-select: none;
    z-index: 50;
    white-space: nowrap;
    backdrop-filter: blur(0.5px);
}

/* ===== subtle desktop clock — center top, rests behind windows ===== */
#deskclock {
    position: fixed;
    top: 42px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none; user-select: none;
    z-index: 1;
    text-shadow: 0 2px 30px rgba(0, 0, 0, 0.55);
    font-family: var(--clock-font, &#39;SF Pro Display&#39;, -apple-system, system-ui, sans-serif);
}
#deskclock .dc-time { font-size: 62px; font-weight: 700; letter-spacing: 0.01em; line-height: 1; color: rgba(255, 255, 255, 0.26); }
#deskclock .dc-date { font-size: 14px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; margin-top: 9px; color: rgba(255, 255, 255, 0.2); }

/* ===== windows ===== */
.window {
    background: rgba(14, 14, 18, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 28px 60px rgba(0, 0, 0, 0.55),
        0 6px 16px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(32px) saturate(140%);
    display: flex; flex-direction: column;
    min-width: 360px; min-height: 240px;
    overflow: hidden;
    transition: transform 240ms var(--motion), opacity 240ms var(--motion),
                width 240ms var(--motion), height 240ms var(--motion),
                top 240ms var(--motion), left 240ms var(--motion),
                border-radius 240ms var(--motion);
}
.window.dragging, .window.resizing {
    transition: none !important;
    box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 36px 90px rgba(0, 0, 0, 0.7),
        0 8px 18px rgba(0, 0, 0, 0.45);
}
/* while moving/resizing a window, iframes (module content) must not swallow the
   mouse — otherwise the cursor passing over any window&#39;s iframe kills the global
   mousemove and the drag freezes/lags. */
body.win-moving iframe { pointer-events: none !important; }
body.win-moving { cursor: inherit; user-select: none; }
/* maximized stops above the taskbar (override inline w/h) */
.window.maximized { border-radius: 0; border: 0; inset: 0 0 var(--taskbar-h) 0 !important; width: auto !important; height: auto !important; }
.window.minimizing, .window.closing {
    transform: scale(0.05) translateY(40vh);
    opacity: 0;
}
.window.opening { animation: winOpen 260ms var(--motion); }
@keyframes winOpen {
    from { transform: scale(0.96) translateY(6px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
}

.win-titlebar {
    height: 32px;
    display: flex; align-items: stretch;
    background: rgba(15, 15, 20, 0.55);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    cursor: grab;
    flex: 0 0 auto;
    position: relative;
    z-index: 6;
}
.win-titlebar.grabbing { cursor: grabbing; }
.win-title {
    flex: 1; min-width: 0;
    padding: 0 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500;
    color: rgba(255, 255, 255, 0.78);
    pointer-events: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.win-title .win-ic { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; flex: 0 0 auto; }
.win-title .win-ic-fb { font-size: 15px; flex: 0 0 auto; color: rgba(255, 255, 255, 0.7); }
.win-traffic {
    display: flex;
    flex: 0 0 auto;
    pointer-events: auto;
}
.win-traffic .tl {
    width: 46px; height: 100%;
    border-radius: 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.78);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 100ms, color 100ms;
    border: 0; padding: 0;
}
.win-traffic .tl svg { width: 10px; height: 10px; }
.win-traffic .tl:hover { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 1); }
.win-traffic .tl.close:hover { background: #e81123; color: #fff; }
.win-traffic .tl.close:active { background: #b80f1c; }
/* swap maximize ↔ restore icon based on window state */
.win-traffic .tl.max .ico-restore { display: none; }
.window.maximized .win-traffic .tl.max .ico-max { display: none; }
.window.maximized .win-traffic .tl.max .ico-restore { display: block; }

.win-body {
    flex: 1 1 auto; position: relative;
    overflow: auto;
    background: transparent;
}
.win-body iframe { display: block; width: 100%; height: 100%; border: 0; background: rgba(0,0,0,0.15); }

/* maximized: keep the titlebar ALWAYS visible so restore/min/close are
   reachable (it used to auto-hide until you hovered the top 6px, which left
   maximized apps looking chromeless — users couldn&#39;t find how to resize). */
.win-hover-top {
    display: none;
    position: absolute; top: 0; left: 0; right: 0;
    height: 6px; z-index: 7;
}
.window.maximized .win-hover-top { display: none; }
.window.maximized .win-titlebar {
    position: relative; top: auto; left: auto; right: auto;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    transform: none;
}
.window.maximized .win-body {
    position: relative; inset: auto;
}

.win-grip { position: absolute; z-index: 2; }
.win-grip.n  { top: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
.win-grip.s  { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
.win-grip.w  { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
.win-grip.e  { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
.win-grip.nw { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.win-grip.ne { top: -3px; right: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.win-grip.sw { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.win-grip.se { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.window.maximized .win-grip { display: none; }

#snap-preview {
    position: fixed; pointer-events: none; z-index: 8000;
    background: rgba(255, 132, 83, 0.18);
    border: 2px solid var(--accent);
    border-radius: 12px;
    opacity: 0;
    transition: opacity 120ms;
}
#snap-preview.show { opacity: 1; }

/* ===== windows taskbar ===== */
#taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: var(--taskbar-h);
    display: flex; align-items: center;
    padding: 0 6px; gap: 4px;
    background: rgba(16, 16, 20, 0.82);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(28px) saturate(140%);
    z-index: 5000;
}
/* start button */
#start-btn {
    width: 46px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); flex: 0 0 auto;
    transition: background 120ms;
}
#start-btn:hover { background: rgba(255, 255, 255, 0.08); }
#start-btn.open { background: var(--accent-soft); }
#start-btn .logo { width: 20px; height: 20px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2.5px; }
#start-btn .logo span { background: var(--accent); border-radius: 2px; }

.tb-divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex: 0 0 auto; }

/* running/pinned app buttons */
#tb-apps { display: flex; align-items: center; gap: 3px; flex: 1; min-width: 0; overflow: hidden; }
.tb-app {
    height: 38px; min-width: 44px; padding: 0 10px;
    border-radius: 8px; position: relative;
    display: flex; align-items: center; gap: 8px;
    color: var(--text-dim); font-size: 12.5px;
    transition: background 120ms, color 120ms;
    max-width: 180px;
}
.tb-app:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
.tb-app.running { color: var(--text); background: rgba(255, 255, 255, 0.05); }
.tb-app.active { background: rgba(255, 255, 255, 0.12); }
.tb-app .ic { font-size: 18px; display: flex; }
.tb-app .ic i { font-size: 18px; }
.tb-app .ic img { width: 18px; height: 18px; object-fit: contain; }
.tb-app .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* running underline */
.tb-app.running::after {
    content: &#39;&#39;; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    width: 16px; height: 2.5px; border-radius: 2px; background: var(--text-dim);
    transition: width 140ms, background 140ms;
}
.tb-app.active::after { width: 22px; background: var(--accent); }
/* all windows minimized — dim it a touch */
.tb-app.minimized { opacity: 0.65; }
.tb-app.minimized:hover { opacity: 1; }

/* ===== system tray ===== */
#systray { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; padding-right: 4px; }
.tray-btn {
    height: 38px; padding: 0 9px; border-radius: 8px;
    display: flex; align-items: center; gap: 6px;
    color: var(--text-dim); transition: background 120ms, color 120ms;
}
.tray-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
.tray-btn i { font-size: 16px; }
.tray-icons { display: flex; align-items: center; gap: 2px; }
#tray-clock { text-align: right; line-height: 1.15; font-size: 11.5px; color: var(--text); }
#tray-clock .d { font-size: 10.5px; color: var(--text-dim); }
#tray-notif-dot { position: relative; }
#tray-notif-dot.has::after {
    content: &#39;&#39;; position: absolute; top: 7px; right: 7px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    border: 1.5px solid rgba(16,16,20,0.9);
}

/* ===== macOS dock mode (settings → Appearance → Taskbar style) ===== */
body.tb-mac #taskbar {
    left: 50%; right: auto; transform: translateX(-50%);
    bottom: 10px; height: 62px; width: auto; max-width: calc(100vw - 20px);
    padding: 0 9px; gap: 5px;
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(28,28,34,0.5);
    backdrop-filter: blur(34px) saturate(155%);
    box-shadow: 0 20px 52px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14);
}
/* icons must be free to rise OUT of the dock when magnified (overflow was clipping them) */
body.tb-mac #tb-apps, body.tb-mac #taskbar, body.tb-mac #systray { overflow: visible; }
/* app + start buttons become square icons; JS magnifies them by cursor distance */
body.tb-mac #start-btn,
body.tb-mac .tb-app {
    width: 48px; height: 48px; min-width: 48px; max-width: 48px; padding: 0;
    flex-direction: column; justify-content: center; border-radius: 13px;
    transform-origin: bottom center;
}
body.tb-mac #start-btn, body.tb-mac .tb-app, body.tb-mac .tray-btn {
    transition: transform 120ms ease-out, background 130ms; will-change: transform;
    transform-origin: bottom center;
}
body.tb-mac .tb-app .tl { display: none; }
body.tb-mac .tb-app .ic { font-size: 32px; }
body.tb-mac .tb-app .ic i { font-size: 32px; }
body.tb-mac .tb-app .ic img { width: 32px; height: 32px; }
body.tb-mac #start-btn .logo { width: 26px; height: 26px; gap: 3px; }
body.tb-mac .tb-app:hover, body.tb-mac #start-btn:hover, body.tb-mac .tray-btn:hover { background: transparent; }
/* running dot under the icon instead of the windows underline */
body.tb-mac .tb-app.running::after { width: 4px; height: 4px; border-radius: 50%; bottom: 3px; }
body.tb-mac .tb-app.active::after { width: 4px; background: var(--accent); }
/* divider + tray tuck into the dock end; big desktop clock covers the time */
body.tb-mac .tb-divider { height: 34px; margin: 0 3px; }
body.tb-mac #systray { gap: 0; }
body.tb-mac .tray-btn { height: 44px; border-radius: 12px; }
body.tb-mac #tray-clock-btn { display: none; }

/* ===== mini player ===== */
#tb-music {
    display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
    height: 38px; padding: 0 4px 0 5px; margin-right: 4px;
    border-radius: 11px; position: relative; overflow: hidden;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    animation: tbmIn 220ms var(--motion);
}
#tb-music[hidden] { display: none; }
@keyframes tbmIn { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
.tbm-art { width: 28px; height: 28px; border-radius: 6px; flex: 0 0 auto; background-size: cover; background-position: center;
    background-color: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 14px; }
.tbm-meta { width: 96px; min-width: 0; cursor: pointer; }
.tbm-meta:hover .tbm-title { color: var(--accent); }
.tbm-title { font-size: 11.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 120ms; }
.tbm-artist { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.tbm-ctrls { display: flex; align-items: center; gap: 1px; }
.tbm-btn { width: 26px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: background 120ms, color 120ms; }
.tbm-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.tbm-btn i { font-size: 16px; }
.tbm-btn.play { color: var(--text); }
.tbm-btn.play i { font-size: 19px; }
.tbm-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: rgba(255,255,255,0.09); cursor: pointer; }
.tbm-prog-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 0 2px 2px 0; transition: width 220ms linear; }
/* volume popover */
#tbm-volpop {
    position: fixed; bottom: calc(var(--taskbar-h) + 8px); z-index: 5600;
    display: none; padding: 12px 14px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
    backdrop-filter: blur(30px) saturate(150%);
}
#tbm-volpop.show { display: block; animation: smOpen 160ms var(--motion); }
#tbm-volpop input[type=range] { -webkit-appearance: none; appearance: none; width: 150px; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.18); outline: none; }
#tbm-volpop input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
#tbm-volpop input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--accent); cursor: pointer; }
@media (max-width: 720px) { .tbm-meta { display: none; } }

/* ===== start menu ===== */
#startmenu {
    position: fixed; left: 8px; bottom: calc(var(--taskbar-h) + 8px);
    width: 380px; max-height: 560px;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(34px) saturate(150%);
    z-index: 6000; display: none; flex-direction: column;
    overflow: hidden;
}
#startmenu.show { display: flex; animation: smOpen 180ms var(--motion); }
@keyframes smOpen { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
#startmenu .sm-search { display: flex; align-items: center; gap: 9px; margin: 14px; padding: 9px 13px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; }
#startmenu .sm-search i { color: var(--text-faint); }
#startmenu .sm-search input { flex: 1; font-size: 13px; }
#startmenu .sm-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); padding: 4px 18px; }
#startmenu .sm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 12px 12px; overflow-y: auto; }
.sm-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 6px 11px; border-radius: 11px; cursor: pointer;
    color: var(--text); transition: background 120ms;
}
.sm-tile:hover { background: rgba(255, 255, 255, 0.08); }
.sm-tile .ic { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.sm-tile .ic img { width: 34px; height: 34px; object-fit: contain; }
.sm-tile .nm { font-size: 11px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#startmenu .sm-foot { display: flex; align-items: center; padding: 10px 16px; border-top: 1px solid var(--border); }
#startmenu .sm-user { flex: 1; display: flex; align-items: center; gap: 9px; color: var(--text-dim); font-size: 12.5px; }
#startmenu .sm-user .av { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 32% 26%, #34343e, #18181d); border: 1px solid rgba(255,255,255,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; font-size: 12px; }
#startmenu .sm-power { width: 34px; height: 34px; border-radius: 8px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
#startmenu .sm-power:hover { background: rgba(255,80,80,0.16); color: #ff7474; }

/* ===== tray flyouts (volume / quick settings) ===== */
.flyout {
    position: fixed; bottom: calc(var(--taskbar-h) + 8px);
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(30px); z-index: 6000; display: none;
    padding: 16px;
}
.flyout.show { display: block; animation: smOpen 160ms var(--motion); }
/* quick settings */
#quicksettings { right: 8px; width: 320px; }
.qs-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.qs-tile {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 13px; border-radius: 11px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; text-align: left;
    transition: background 120ms, color 120ms, border-color 120ms;
}
.qs-tile i { font-size: 19px; }
.qs-tile span { line-height: 1.2; }
.qs-tile:hover { background: rgba(255,255,255,0.09); }
.qs-tile.on { background: var(--accent); border-color: var(--accent); color: #1a0a04; font-weight: 600; }
.qs-slider { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.qs-slider i { font-size: 19px; color: var(--text); width: 22px; text-align: center; }
.qs-slider input[type=range] { flex: 1; -webkit-appearance: none; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.16); }
.qs-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
.qs-slider .pct { font-size: 12px; color: var(--text-dim); width: 38px; text-align: right; }

/* tray cluster shows net + vol grouped */
#tray-quick { gap: 8px; }
#tray-quick i { font-size: 16px; }

/* calendar flyout */
#flyout-cal { right: 8px; width: 300px; }
.cal-now { margin-bottom: 14px; }
.cal-time { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.cal-date { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
.cal-head { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
.cal-head .cal-month { flex: 1; font-size: 13px; font-weight: 600; }
.cal-head button { width: 28px; height: 28px; border-radius: 7px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
.cal-head button:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { font-size: 10px; color: var(--text-faint); text-align: center; padding: 4px 0; font-weight: 700; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 50%; color: var(--text); }
.cal-day.blank { visibility: hidden; }
.cal-day.today { background: var(--accent); color: #1a0a04; font-weight: 700; }
.cal-day:not(.blank):not(.today):hover { background: rgba(255,255,255,0.1); }

/* brightness dimmer */
#brightness-overlay { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 4999; transition: opacity 160ms; }
/* night light warm filter */
#nightlight-overlay { position: fixed; inset: 0; background: #ff8a1e; opacity: 0; pointer-events: none; z-index: 4998; mix-blend-mode: multiply; transition: opacity 220ms; }

/* ===== notification center ===== */
#noticenter {
    position: fixed; top: 8px; right: 8px; bottom: calc(var(--taskbar-h) + 8px);
    width: 360px;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(34px) saturate(150%);
    z-index: 6000; display: none; flex-direction: column; overflow: hidden;
}
#noticenter.show { display: flex; animation: ncOpen 200ms var(--motion); }
@keyframes ncOpen { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
#noticenter .nc-head { display: flex; align-items: center; padding: 16px 18px 10px; }
#noticenter .nc-head .t { flex: 1; font-size: 14px; font-weight: 600; }
#noticenter .nc-head button { font-size: 12px; color: var(--text-dim); padding: 4px 8px; border-radius: 6px; }
#noticenter .nc-head button:hover { background: rgba(255,255,255,0.08); color: var(--text); }
#noticenter .nc-list { flex: 1; overflow-y: auto; padding: 6px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.nc-card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 11px; padding: 12px 13px; position: relative; }
.nc-card .nt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.nc-card .nt i { color: var(--accent); }
.nc-card .nb { font-size: 12px; color: var(--text-dim); margin-top: 5px; line-height: 1.45; }
.nc-card .nx { position: absolute; top: 8px; right: 8px; color: var(--text-faint); width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.nc-card .nx:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.nc-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-faint); }
.nc-empty i { font-size: 40px; opacity: 0.3; }

/* toast stack */
#toasts { position: fixed; right: 12px; bottom: calc(var(--taskbar-h) + 12px); z-index: 6500; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
    width: 320px; background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(28px);
    padding: 13px 14px; pointer-events: auto;
    animation: toastIn 220ms var(--motion);
}
.toast.out { animation: toastOut 220ms var(--motion) forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }
.toast .tt { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.toast .tt i { color: var(--accent); }
.toast .tb2 { font-size: 12px; color: var(--text-dim); margin-top: 5px; line-height: 1.45; }

/* account app — ms style */
.acct { position: relative; padding: 34px 38px 26px; display: flex; flex-direction: column; height: 100%; overflow: hidden; font-family: &#39;Segoe UI&#39;, &#39;Segoe UI Variable Text&#39;, system-ui, sans-serif; animation: acctIn 280ms var(--motion); }
@keyframes acctIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
/* lockup */
.ms-lockup { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.ms-sq { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 20px; height: 20px; }
.ms-sq span:nth-child(1) { background: #f25022; }
.ms-sq span:nth-child(2) { background: #7fba00; }
.ms-sq span:nth-child(3) { background: #00a4ef; }
.ms-sq span:nth-child(4) { background: #ffb900; }
.ms-word { font-size: 16.5px; font-weight: 600; color: rgba(255,255,255,0.94); }
/* steps */
.ms-flow { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.ms-step { display: none; }
.ms-step.on { display: flex; flex-direction: column; flex: 1; animation: msStep 240ms var(--motion); }
@keyframes msStep { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
.ms-title { font-size: 23px; font-weight: 600; color: #fff; margin-bottom: 18px; letter-spacing: -0.01em; }
.ms-ident { display: flex; align-items: center; gap: 6px; margin: -6px 0 14px; font-size: 13px; color: var(--text-dim); }
.ms-back { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; color: var(--text-dim); font-size: 15px; cursor: pointer; transition: background 120ms, color 120ms; }
.ms-back:hover { background: rgba(255,255,255,0.08); color: #fff; }
/* underline inputs */
.ms-field { margin-bottom: 14px; }
.ms-field input { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.4); border-radius: 0; padding: 7px 0; font-size: 15px; color: #fff; font-family: inherit; transition: border-color 140ms; }
.ms-field input::placeholder { color: var(--text-faint); }
.ms-field input:focus { outline: none; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.ms-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
.ms-links { font-size: 13px; color: var(--text-dim); }
.ms-links a { color: var(--accent); cursor: pointer; }
.ms-links a:hover { text-decoration: underline; }
.ms-msg { font-size: 12.5px; color: var(--text-dim); min-height: 17px; margin-top: 10px; }
.ms-msg.err { color: #ff7b72; }
/* dialog buttons */
.ms-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; padding-top: 16px; }
.ms-btn { min-width: 108px; padding: 9px 14px; border-radius: 4px; background: var(--accent); color: #1a0a04; font-weight: 600; font-size: 13.5px; font-family: inherit; cursor: pointer; transition: filter 120ms, transform 100ms; }
.ms-btn:hover { filter: brightness(1.08); }
.ms-btn:active { transform: scale(0.98); }
.ms-btn.sec { background: rgba(255,255,255,0.1); color: #fff; }
.ms-btn.sec:hover { background: rgba(255,255,255,0.15); filter: none; }
/* signed in */
.ms-me { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
.ms-av { position: relative; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: #1a0a04; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex-shrink: 0; overflow: hidden; cursor: pointer; padding: 0; border: 0; }
.ms-av img { width: 100%; height: 100%; object-fit: cover; }
.ms-av-edit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); color: #fff; font-size: 20px; opacity: 0; transition: opacity .12s; }
.ms-av:hover .ms-av-edit { opacity: 1; }
.ms-av.busy .ms-av-edit { opacity: 1; }
.ms-me-name { font-size: 19px; font-weight: 600; color: #fff; }
.ms-me-email { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
.acct-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: var(--text-faint); padding: 0 24px; }
.acct-empty i { font-size: 42px; opacity: 0.4; }
.acct-empty .lead { font-size: 14px; color: var(--text-dim); }
.acct-empty .sub { font-size: 12px; line-height: 1.5; }
.acct-empty code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
#startmenu .sm-user { cursor: pointer; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; transition: background 120ms; }
#startmenu .sm-user:hover { background: rgba(255,255,255,0.06); }

/* ===== spotlight ===== */
#spotlight {
    inset: 0; z-index: 7000;
    display: none; align-items: flex-start; justify-content: center;
    padding-top: 18vh;
    background: rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(8px);
}
#spotlight.show { display: flex; }
#spotlight .panel {
    width: min(640px, 92vw);
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: winOpen 200ms var(--motion);
}
#spotlight .input-row {
    display: flex; align-items: center; gap: 12px;
    padding: 0 22px; border-bottom: 1px solid var(--border);
}
#spotlight .input-row i { color: var(--text-faint); font-size: 18px; }
#spotlight input { flex: 1; padding: 18px 0; font-size: 18px; font-weight: 300; }
#spotlight .results { max-height: 50vh; overflow-y: auto; padding: 6px 0; }
#spotlight .group-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    color: var(--text-faint); text-transform: uppercase;
    padding: 12px 22px 4px;
}
#spotlight .result {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 22px; cursor: pointer;
}
#spotlight .result:hover, #spotlight .result.active {
    background: var(--accent-soft);
}
#spotlight .result .ricon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex: 0 0 auto;
}
#spotlight .result .rmain { flex: 1; min-width: 0; }
#spotlight .result .rtitle { font-size: 14px; }
#spotlight .result .rsub { font-size: 11px; color: var(--text-faint); }
#spotlight .result .rkey { font-size: 11px; color: var(--text-faint); }
#spotlight .empty { padding: 32px; text-align: center; color: var(--text-faint); font-size: 13px; }

/* ===== topbar (centered date + time, large + faded) ===== */
#topbar {
    position: fixed;
    top: 24px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    z-index: 1; pointer-events: none;
    user-select: none;
}
#topbar .clock {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: rgba(255, 255, 255, 0.32);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}
#topbar .date {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.26);
}

/* ===== settings — sidebar layout ===== */
.settings-app {
    display: grid;
    grid-template-columns: 200px 1fr;
    height: 100%;
    background: rgba(10, 10, 14, 0.5);
}
.settings-side {
    background: rgba(0, 0, 0, 0.18);
    border-right: 1px solid rgba(255, 255, 255, 0.06);
    padding: 20px 12px;
    display: flex; flex-direction: column;
}
.settings-side .brand {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-faint);
    padding: 4px 10px 16px;
}
.settings-side .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 13px; color: var(--text-dim);
    cursor: pointer;
    transition: background 120ms, color 120ms;
    border: 0; background: none; width: 100%;
    text-align: left;
}
.settings-side .nav-item i { font-size: 16px; opacity: 0.85; }
.settings-side .nav-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
.settings-side .nav-item.active {
    background: rgba(255, 132, 83, 0.14);
    color: #fff;
}
.settings-side .nav-item.active i { color: #ff8453; opacity: 1; }
.settings-side .spacer { flex: 1; }
.settings-side .build {
    font-size: 10px; color: rgba(255, 255, 255, 0.32);
    letter-spacing: 0.08em; padding: 0 10px;
}

.settings-main {
    overflow-y: auto;
    padding: 36px 44px 60px;
}
.settings-main::-webkit-scrollbar { width: 8px; }
.settings-main::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
.settings-page { display: none; }
.settings-page.active { display: block; }
.settings-page &gt; h2 {
    margin: 0 0 4px;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
}
.settings-page &gt; .lead {
    color: var(--text-faint);
    font-size: 13px;
    margin-bottom: 28px;
}

/* card — groups related rows */
.s-card {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 4px 18px;
    margin-bottom: 18px;
}
.s-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.s-row:first-child { border-top: 0; }
.s-row .col-l {
    flex: 1; min-width: 0;
}
.s-row .col-r {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
}
.s-row .ttl { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.s-row .desc { font-size: 12px; color: var(--text-faint); line-height: 1.5; }

/* stacked rows used when input is full-width below the title */
.s-row.stack { flex-direction: column; align-items: stretch; gap: 12px; }
.s-row.stack .col-l { display: flex; justify-content: space-between; align-items: center; gap: 16px; }

/* form controls */
.s-input, .s-select {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    min-width: 220px;
    transition: border-color 120ms, background 120ms;
}
.s-input:hover, .s-select:hover { border-color: rgba(255, 255, 255, 0.16); }
.s-input:focus, .s-select:focus {
    outline: none;
    border-color: rgba(255, 132, 83, 0.6);
    background: rgba(0, 0, 0, 0.4);
}
.s-input.full, .s-select.full { width: 100%; min-width: 0; }

.s-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 120ms, border-color 120ms;
}
.s-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.18); }
.s-btn.primary {
    background: #ff8453; color: #1a0a04; border-color: #ff8453;
}
.s-btn.primary:hover { background: #ffa078; border-color: #ffa078; }
.s-btn.ghost {
    background: transparent;
}
.s-btn.danger { color: #ff6868; border-color: rgba(255, 104, 104, 0.3); }

/* wallpaper gallery */
.wall-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 4px; }
.wall-tile { position: relative; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2.5px solid transparent; background: #14141a; background-size: cover; background-position: center; transition: border-color 140ms, transform 140ms; }
.wall-tile:hover { transform: scale(1.03); }
.wall-tile.on { border-color: var(--accent); }
.wall-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wall-tile .wl { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 9px 7px; font-size: 11px; font-weight: 600; color: #fff; background: linear-gradient(to top, rgba(0,0,0,0.78), transparent); z-index: 1; line-height: 1.2; }
.wall-tile.on .wl::before { content: &#39;\ea5e&#39;; font-family: &#39;remixicon&#39;; margin-right: 4px; color: var(--accent); }
.accent-grid { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 4px; }
.accent-sw { width: 34px; height: 34px; border-radius: 50%; background: var(--sw); cursor: pointer; position: relative; border: 0; box-shadow: 0 0 0 2px rgba(255,255,255,0.08); transition: transform 150ms var(--motion), box-shadow 160ms; display: flex; align-items: center; justify-content: center; }
.accent-sw:hover { transform: scale(1.12); }
.accent-sw i { color: #fff; font-size: 17px; opacity: 0; transform: scale(0.4); transition: opacity 150ms, transform 200ms var(--motion); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.55)); }
.accent-sw.on { box-shadow: 0 0 0 2px var(--sw), 0 5px 16px -3px var(--sw); }
.accent-sw.on i { opacity: 1; transform: scale(1); }
/* custom color-wheel swatch — rainbow until a color is chosen, then shows that color */
.accent-custom { background: conic-gradient(from 0deg, #ff8453, #ffe14a, #37e07a, #33d6d6, #4aa8ff, #b06bff, #ff6ec7, #ff8453); overflow: hidden; }
.accent-custom input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.accent-custom i { color: #fff; font-size: 15px; opacity: 1; transform: none; text-shadow: 0 1px 3px rgba(0,0,0,0.65); }
.accent-custom.on { background: var(--sw); box-shadow: 0 0 0 2px var(--sw), 0 5px 16px -3px var(--sw); }

/* key recorder */
.key-rec {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px; cursor: pointer;
    min-width: 200px; text-align: center;
    transition: border-color 120ms, background 120ms;
}
.key-rec:hover { border-color: rgba(255, 255, 255, 0.16); }
.key-rec.recording {
    border-color: #ff8453;
    background: rgba(255, 132, 83, 0.12);
    color: #ff8453;
    animation: kr-pulse 1.4s ease-in-out infinite;
}
@keyframes kr-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 132, 83, 0); }
    50%      { box-shadow: 0 0 0 4px rgba(255, 132, 83, 0.15); }
}
.key-rec .kbd {
    padding: 2px 8px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    background: rgba(0, 0, 0, 0.4);
    color: var(--text);
    margin-right: 4px;
}

/* toggle switch */
.s-toggle { position: relative; display: inline-block; width: 38px; height: 22px; flex: 0 0 auto; }
.s-toggle input { opacity: 0; width: 0; height: 0; }
.s-toggle .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 22px;
    transition: background 160ms;
}
.s-toggle .slider::before {
    content: &#39;&#39;; position: absolute;
    height: 16px; width: 16px;
    left: 3px; top: 3px;
    background: #fff; border-radius: 50%;
    transition: transform 180ms var(--motion);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}
.s-toggle input:checked + .slider { background: #ff8453; }
.s-toggle input:checked + .slider::before { transform: translateX(16px); }

/* ============================================================
   BOOT SCREEN — clean wordmark reveal
   ============================================================ */
#boot {
    position: fixed; inset: 0;
    z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(24,20,32,0.62), rgba(6,6,9,0.9));
    backdrop-filter: blur(30px) saturate(122%);
    -webkit-backdrop-filter: blur(30px) saturate(122%);
    cursor: pointer; pointer-events: auto; overflow: hidden;
    animation: bootIn 480ms ease;
}
@keyframes bootIn { from { opacity: 0; } to { opacity: 1; } }
#boot.fading { animation: boot-fade 680ms cubic-bezier(0.55, 0, 0.5, 1) forwards; }
@keyframes boot-fade {
    to { opacity: 0; transform: scale(1.05); visibility: hidden; pointer-events: none;
         backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
}
.enter-stage { display: flex; flex-direction: column; align-items: center;
    animation: bootStageIn 720ms cubic-bezier(0.22,1,0.36,1) both; }
@keyframes bootStageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

/* wordmark + prompt */
.enter-word {
    font-size: 40px; font-weight: 300; letter-spacing: 0.42em; padding-left: 0.42em;
    font-family: &#39;SF Pro Display&#39;, -apple-system, system-ui, sans-serif;
    background: linear-gradient(100deg, rgba(255,255,255,0.36) 40%, #ffffff 50%, rgba(255,255,255,0.36) 60%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    animation: boot-shimmer 3.6s linear infinite;
}
@keyframes boot-shimmer { from { background-position: 180% 0; } to { background-position: -180% 0; } }
.enter-btn {
    margin-top: 24px; padding: 12px 30px; border-radius: 30px; color: #fff;
    font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);
    transition: background 160ms, border-color 160ms, transform 160ms;
}
.enter-btn:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.32); transform: translateY(-1px); }
.enter-btn span { display: inline-block; animation: enterPulse 2.4s ease-in-out infinite; }
@keyframes enterPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes boot-fade-in { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
    .enter-word, .enter-btn span { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
}

/* =========================================================
   updates + announcements  (clean typographic changelog feed)
   ========================================================= */
.win-body[data-app=&#34;updates&#34;], .win-body[data-app=&#34;announce&#34;] { background: var(--bg); }
.upd-app { height: 100%; overflow-y: auto; padding: 32px 30px 36px; }
.upd-entry { padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
.upd-entry:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 6px; }
.upd-title { font-size: 21px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 8px; }
.upd-meta { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-faint); margin-bottom: 22px; }
.upd-meta .v { color: var(--text-dim); font-variant-numeric: tabular-nums; }
.upd-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .55; }
.upd-latest { margin-left: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; }
.upd-group { margin-bottom: 18px; }
.upd-group:last-child { margin-bottom: 0; }
.upd-glabel { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gc); margin-bottom: 11px; }
.upd-glabel::before { content: &#39;&#39;; width: 6px; height: 6px; border-radius: 50%; background: var(--gc); }
.upd-items { display: flex; flex-direction: column; gap: 9px; }
.upd-item { position: relative; padding-left: 16px; font-size: 13.5px; line-height: 1.55; color: var(--text-dim); }
.upd-item::before { content: &#39;&#39;; position: absolute; left: 3px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--border-strong); }

.ann-app { height: 100%; overflow-y: auto; padding: 34px 32px 28px; display: flex; flex-direction: column; }
.ann-top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.ann-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; color: var(--accent); background: var(--accent-soft); flex: none; }
.ann-kicker { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); line-height: 1.4; }
.ann-date { font-size: 12px; color: var(--text-faint); }
.ann-title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.22; margin: 0 0 14px; }
.ann-body { font-size: 14px; line-height: 1.65; color: var(--text-dim); margin: 0; white-space: pre-wrap; }
.ann-foot { margin-top: auto; padding-top: 26px; }
.ann-ok { width: 100%; padding: 12px; border-radius: 11px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: filter .15s, transform .08s; }
.ann-ok:hover { filter: brightness(1.07); }
.ann-ok:active { transform: translateY(1px); }
.ann-empty { margin: auto; color: var(--text-faint); font-size: 13px; }

/* custom scrollbars — updates/announcements windows + spotlight results */
.upd-app, .ann-app, #spotlight .results { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent; }
.upd-app::-webkit-scrollbar, .ann-app::-webkit-scrollbar, #spotlight .results::-webkit-scrollbar { width: 9px; }
.upd-app::-webkit-scrollbar-track, .ann-app::-webkit-scrollbar-track, #spotlight .results::-webkit-scrollbar-track { background: transparent; }
.upd-app::-webkit-scrollbar-thumb, .ann-app::-webkit-scrollbar-thumb, #spotlight .results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
.upd-app::-webkit-scrollbar-thumb:hover, .ann-app::-webkit-scrollbar-thumb:hover, #spotlight .results::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); background-clip: padding-box; }

/* these two windows drop the titlebar app icon for a cleaner header */
.window.bare-title .win-ic, .window.bare-title .win-ic-fb { display: none !important; }
.window.bare-title .win-title { padding-left: 14px; gap: 0; }

/* =========================================================
   onboarding
   ========================================================= */
#onboard { position: fixed; inset: 0; z-index: 90000; display: flex; align-items: center; justify-content: center; background: rgba(8,8,11,0.55); backdrop-filter: blur(26px) saturate(110%); animation: obFade 420ms ease; }
#onboard.hidden { display: none !important; }
#onboard.closing { animation: obFadeOut 320ms ease forwards; }
@keyframes obFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes obFadeOut { to { opacity: 0; visibility: hidden; } }
.ob-card { position: relative; width: min(500px, 92vw); background: rgba(17,17,20,0.78); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; box-shadow: 0 40px 100px rgba(0,0,0,0.62); backdrop-filter: blur(36px) saturate(130%); padding: 40px 38px 24px; overflow: hidden; animation: obCardIn 520ms var(--motion); }
@keyframes obCardIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
.ob-card::before { content: &#39;&#39;; position: absolute; top: -150px; left: 50%; transform: translateX(-50%); width: 500px; height: 360px; background: radial-gradient(circle, rgba(var(--accent-rgb, 255,132,83), 0.22), transparent 62%); pointer-events: none; }
.ob-skip { position: absolute; top: 18px; right: 18px; z-index: 2; font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.4); padding: 7px 13px; border-radius: 9px; transition: background 120ms, color 120ms; }
.ob-skip:hover { background: rgba(255,255,255,0.07); color: #fff; }
.ob-step { position: relative; min-height: 300px; }
/* one orchestrated reveal per step: visual, heading, body, controls rise in sequence */
.ob-step &gt; * { animation: obReveal 480ms var(--motion) both; }
.ob-step &gt; .ob-hero { animation-delay: 30ms; }
.ob-step &gt; .ob-h { animation-delay: 110ms; }
.ob-step &gt; .ob-p { animation-delay: 180ms; }
.ob-step &gt; .ob-grid, .ob-step &gt; .ob-walls, .ob-step &gt; .ob-acct { animation-delay: 250ms; }
@keyframes obReveal { from { opacity: 0; transform: translateY(11px); } to { opacity: 1; transform: translateY(0); } }
.ob-h { font-size: 25px; font-weight: 750; letter-spacing: -0.025em; margin: 0 0 9px; color: #fff; line-height: 1.15; }
.ob-p { font-size: 13.5px; color: rgba(255,255,255,0.55); line-height: 1.62; margin-bottom: 22px; max-width: 42ch; }
.ob-p b { color: rgba(255,255,255,0.9); font-weight: 650; }
/* hero visual zone (replaces the generic icon-in-a-circle) */
.ob-hero { height: 84px; margin-bottom: 22px; display: flex; align-items: center; }
.ob-hero-sm { height: 54px; margin-bottom: 18px; }
.ob-hero-sm i { font-size: 25px; color: #fff; width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: linear-gradient(150deg, rgba(var(--accent-rgb,255,132,83),0.28), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.11); }
/* welcome — the Serum four-square mark, tiles popping in */
.ob-mark { width: 62px; height: 62px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ob-mark i { border-radius: 8px; background: linear-gradient(150deg, var(--accent), #ffcfa6); transform: scale(0.4); opacity: 0; animation: obMark 640ms var(--motion) forwards; }
.ob-mark i:nth-child(1){animation-delay:.10s} .ob-mark i:nth-child(2){animation-delay:.20s}
.ob-mark i:nth-child(3){animation-delay:.30s} .ob-mark i:nth-child(4){animation-delay:.40s}
@keyframes obMark { to { transform: scale(1); opacity: 1; } }
/* ads — 4 tall bright bars burst in fast (back-to-back), then sparse faint ticks after
   a gap. the caption sits BELOW (ob-hero-ads is column, fixing the row-overlap bug). */
.ob-hero-ads { flex-direction: column; align-items: stretch; height: auto; gap: 11px; margin-bottom: 22px; }
.ob-ads-bars { display: flex; align-items: flex-end; height: 60px; gap: 5px; }
.ob-ads-bars b { border-radius: 3px 3px 1px 1px; transform: scaleY(0.14); transform-origin: bottom; opacity: 0; animation: obBar 300ms var(--motion) forwards; }
.ob-ads-bars b.burst { flex: 0 0 15px; height: 100%; background: linear-gradient(to top, var(--accent), #ffcaa0); box-shadow: 0 0 14px -2px rgba(var(--accent-rgb,255,132,83),0.5); }
.ob-ads-bars b.burst:nth-child(1){animation-delay:.12s} .ob-ads-bars b.burst:nth-child(2){animation-delay:.24s}
.ob-ads-bars b.burst:nth-child(3){animation-delay:.36s} .ob-ads-bars b.burst:nth-child(4){animation-delay:.48s}
.ob-ads-bars b.rare { flex: 1; height: 40%; background: rgba(255,255,255,0.14); animation-duration: 460ms; }
.ob-ads-bars b.rare:nth-child(5){ margin-left: 16px; animation-delay:.74s } .ob-ads-bars b.rare:nth-child(6){animation-delay:.88s}
.ob-ads-bars b.rare:nth-child(7){animation-delay:1.02s} .ob-ads-bars b.rare:nth-child(8){animation-delay:1.16s} .ob-ads-bars b.rare:nth-child(9){animation-delay:1.3s}
@keyframes obBar { to { transform: scaleY(1); opacity: 1; } }
.ob-ads-cap { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.34); }
.ob-ads-cap b { color: var(--accent); font-weight: 700; }
/* ctrl+k — physical keycaps */
.ob-keys { display: flex; align-items: center; gap: 11px; }
.ob-keys kbd { font: 700 15px/1 -apple-system, system-ui, sans-serif; color: #fff; padding: 13px 16px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 3px 0 rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.16); animation: obKey 520ms var(--motion) both; }
.ob-keys kbd.k { background: linear-gradient(180deg, var(--accent), #c9552a); border-color: rgba(255,255,255,0.22); box-shadow: 0 3px 0 rgba(120,40,10,0.5), inset 0 1px 0 rgba(255,255,255,0.2); animation-delay: .16s; }
.ob-keys span { color: rgba(255,255,255,0.35); font-size: 16px; font-weight: 600; }
@keyframes obKey { from { opacity: 0; transform: translateY(-7px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
    .ob-step &gt; *, .ob-mark i, .ob-ads-bars b, .ob-keys kbd, .ob-card, #onboard { animation-duration: 1ms !important; animation-delay: 0ms !important; }
}
.ob-toggle { display: flex; align-items: center; gap: 14px; padding: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; cursor: pointer; user-select: none; transition: border-color 140ms; }
.ob-toggle:hover { border-color: rgba(255,255,255,0.16); }
.ob-toggle .tt { flex: 1; }
.ob-toggle .tt .t1 { font-size: 14px; font-weight: 600; color: #fff; }
.ob-toggle .tt .t2 { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 3px; }
.ob-sw { width: 46px; height: 27px; border-radius: 14px; background: rgba(255,255,255,0.14); position: relative; transition: background 200ms; flex: 0 0 auto; }
.ob-sw::after { content: &#39;&#39;; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform 220ms var(--motion); }
.ob-toggle.on .ob-sw { background: rgba(255,255,255,0.9); }
.ob-toggle.on .ob-sw::after { transform: translateX(19px); background: #111; }
.ob-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; max-height: 232px; overflow-y: auto; padding-right: 6px; margin-right: -6px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent; }
.ob-grid::-webkit-scrollbar { width: 6px; }
.ob-grid::-webkit-scrollbar-track { background: transparent; }
.ob-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
.ob-grid::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
.ob-opt { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 8px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.07); cursor: pointer; transition: border-color 140ms, background 140ms; }
.ob-opt:hover { background: rgba(255,255,255,0.06); }
.ob-opt.on { border-color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.08); }
.ob-opt img { width: 28px; height: 28px; border-radius: 6px; }
.ob-opt .ol { font-size: 11px; color: rgba(255,255,255,0.5); text-align: center; line-height: 1.25; }
.ob-opt.on .ol { color: #fff; }
.ob-walls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
.ob-wall { position: relative; aspect-ratio: 16/10; border-radius: 11px; overflow: hidden; cursor: pointer; border: 2.5px solid transparent; background: #14141a; background-size: cover; background-position: center; transition: border-color 140ms, transform 140ms; }
.ob-wall:hover { transform: scale(1.04); }
.ob-wall.on { border-color: #fff; }
.ob-wall video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ob-wl { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 6px 5px; font-size: 9px; font-weight: 600; color: #fff; background: linear-gradient(to top, rgba(0,0,0,0.82), transparent); z-index: 1; line-height: 1.15; }
.ob-acct { display: flex; flex-direction: column; gap: 10px; }
.ob-acct .ob-btn { width: 100%; }
.ob-nav { display: flex; align-items: center; margin-top: 16px; }
.ob-dots { flex: 1; display: flex; gap: 6px; }
.ob-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.16); transition: width 240ms var(--motion), background 240ms; }
.ob-dot.on { width: 22px; border-radius: 4px; background: #fff; }
.ob-btn { padding: 12px 28px; border-radius: 12px; background: #fff; color: #0c0c0e; font-weight: 700; font-size: 13.5px; transition: transform 120ms, box-shadow 160ms, background 140ms; }
.ob-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,0.42); background: #f0f0f2; }
.ob-btn.ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.72); }
.ob-btn.ghost:hover { background: rgba(255,255,255,0.1); color: #fff; transform: none; box-shadow: none; }

/* status line under the loader */
.boot-tag {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.3);
    opacity: 0;
    animation: boot-fade-in 500ms ease 620ms forwards;
}

/* upload row hint */
.s-upload-row .hint {
    margin-top: 8px;
    color: var(--text-faint);
    font-size: 11.5px;
    line-height: 1.55;
}

    <div id="boot">
      <div class="enter-stage">
        <div class="enter-word">
          SERUM
        </div>

          <span>          Click to enter
</span>
        </button>
      </div>
    </div>
    <div id="onboard" class="hidden">
      <div class="ob-card">
        <button class="ob-skip" id="ob-skip">
          Skip
        </button>
        <div class="ob-step" id="ob-step">
        </div>
        <div class="ob-nav">
          <div class="ob-dots" id="ob-dots">
          </div>
          <button class="ob-btn" id="ob-next">
            Get started
          </button>
        </div>
      </div>
    </div>
    <div id="bg">
      <video id="bg-video" autoplay="" loop="" muted="" playsinline="">
      </video>
    </div>
    <div id="petals">
    </div>
    <div id="desktop">
    </div>
    <canvas id="signal" aria-hidden="true">
    </canvas>
    <div id="desk-marquee">
    </div>
    <div id="watermark">
      SERUMOS
    </div>
    <div id="deskclock">
      <div class="dc-time">
        —
      </div>
      <div class="dc-date">
        —
      </div>
    </div>
    <div id="snap-preview">
    </div>
    <div id="taskbar">
      <button id="start-btn" title="Start">
        <span class="logo">        <span></span>
        <span></span>
        <span></span>
        <span></span>
</span>
      </button>
      <div class="tb-divider">
      </div>
      <div id="tb-apps">
      </div>
      <div id="tb-music" hidden="">
        <div class="tbm-art" id="tbm-art">
        </div>

          <div class="tbm-title" id="tbm-title">
            —
          </div>
          <div class="tbm-artist" id="tbm-artist">
            —
          </div>
        </div>

            <i class="ri-skip-back-mini-fill"></i>
          </button>
          <button class="tbm-btn play" id="tbm-play" title="Play/pause">
            <i class="ri-play-fill" id="tbm-play-ic"></i>
          </button>
          <button class="tbm-btn" id="tbm-next" title="Next">
            <i class="ri-skip-forward-mini-fill"></i>
          </button>

            </div>
            <div class="d">

            </div>
          </div>
